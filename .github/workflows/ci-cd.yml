name: Fraud-Detection CI-CD

on:
  push:
    branches:
      - github-actions

  workflow_dispatch:
jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkoyt repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependences
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements.txt      
          
      - name: Run tests
        run: |
          echo "Running tests..."
          python -m compileall .

      - name: Build Docker image
        run: |
          docker build -t fraud-detection:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag fraud-detection:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detection:latest

